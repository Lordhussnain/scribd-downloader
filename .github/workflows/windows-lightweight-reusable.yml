name: Build lightweight Windows package

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PACKAGE_MODE: ${{ inputs.mode }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust stable MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-core -> target
            rust-browser -> target
            rust-gui -> target
      - name: Run Rust tests
        shell: pwsh
        run: |
          cargo test --manifest-path rust-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path rust-browser/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path rust-gui/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select package variant
        shell: pwsh
        run: |
          switch ($env:PACKAGE_MODE) {
            'DriverOnly' { $folder = 'ScribdDownloader-DriverOnly'; $slug = 'driver-only' }
            'System' { $folder = 'ScribdDownloader-System'; $slug = 'system' }
            default { throw "Unsupported package mode: $env:PACKAGE_MODE" }
          }
          "PACKAGE_FOLDER=$folder" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_SLUG=$slug" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build portable package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build_portable.ps1 -Mode $env:PACKAGE_MODE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show package requirements
        shell: pwsh
        run: Get-Content "dist/$env:PACKAGE_FOLDER/PACKAGE-INFO.txt"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_FOLDER }}-Windows-x64
          path: dist/${{ env.PACKAGE_FOLDER }}/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
      - name: Create release archive
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        shell: pwsh
        run: |
          $archive = "dist/${env:PACKAGE_FOLDER}-Windows-x64.zip"
          Compress-Archive -LiteralPath "dist/$env:PACKAGE_FOLDER" -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Release archive was not created.' }
      - name: Publish GitHub pre-release
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-${env:PACKAGE_SLUG}-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          $notes = @"
          Automated Windows x64 $env:PACKAGE_MODE build for commit $env:GITHUB_SHA.

          $(Get-Content "dist/$env:PACKAGE_FOLDER/PACKAGE-INFO.txt" -Raw)

          Extract the ZIP and run scribd-rust-gui.exe inside the extracted folder. Internet access is required for documents. This is an experimental build.
          "@
          Set-Content -Path dist/release-notes.txt -Value $notes -Encoding UTF8
          $archive = "dist/${env:PACKAGE_FOLDER}-Windows-x64.zip"
          gh release create $tag $archive --target $env:GITHUB_SHA --title "Windows $env:PACKAGE_MODE build $tag" --notes-file dist/release-notes.txt --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
