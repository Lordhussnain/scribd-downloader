name: Windows build - ChromeDriver only

on:
  push:
  pull_request:
  workflow_dispatch:
  # Sundays 02:15 UTC. GitHub schedules run only from the default branch.
  schedule:
    - cron: '15 2 * * 0'

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/windows-lightweight-reusable.yml
    with:
      mode: DriverOnly
