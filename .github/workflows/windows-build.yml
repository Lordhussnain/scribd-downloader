name: Windows portable build

on:
  push:
  pull_request:
  workflow_dispatch:
  # Sundays at 02:00 UTC (07:00 in Pakistan). Scheduled workflows run from
  # the repository's default branch, after this workflow has been merged there.
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust stable MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-core -> target
            rust-browser -> target
            rust-gui -> target

      - name: Run Rust tests
        shell: pwsh
        run: |
          cargo test --manifest-path rust-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path rust-browser/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path rust-gui/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # build_portable.ps1 fetches Chrome for Testing's latest stable metadata,
      # downloads both win64 archives from the same release, verifies their
      # versions, and builds the app with the static MSVC runtime.
      - name: Build portable package with matching Chrome and ChromeDriver
        shell: pwsh
        run: |
          .\build_windows.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show packaged browser version
        shell: pwsh
        run: Get-Content dist/ScribdDownloader-Portable/PACKAGE-INFO.txt

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ScribdDownloader-Windows-x64
          path: dist/ScribdDownloader-Portable/
          if-no-files-found: error
          # Chrome binaries are already compressed; avoid lengthy recompression.
          compression-level: 0
          retention-days: 14

      # Only scheduled/manual builds and default-branch pushes publish. PRs and
      # feature-branch pushes are tested and uploaded as artifacts, never released.
      - name: Create portable release archive
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath dist/ScribdDownloader-Portable -DestinationPath dist/ScribdDownloader-Windows-x64.zip -CompressionLevel Fastest
          if (-not (Test-Path -LiteralPath dist/ScribdDownloader-Windows-x64.zip -PathType Leaf)) { throw 'Release archive was not created.' }

      - name: Publish GitHub pre-release
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $notes = @"
          Automated Windows x64 build for commit $env:GITHUB_SHA.

          $(Get-Content dist/ScribdDownloader-Portable/PACKAGE-INFO.txt -Raw)

          Download and extract the ZIP, then run scribd-rust-gui.exe inside the extracted folder. Keep the runtime folder next to the executable. Internet access is required for documents. This is an experimental build; verify output before relying on it.
          "@
          Set-Content -Path dist/release-notes.txt -Value $notes -Encoding UTF8
          gh release create $tag dist/ScribdDownloader-Windows-x64.zip --target $env:GITHUB_SHA --title "Windows build $tag" --notes-file dist/release-notes.txt --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
